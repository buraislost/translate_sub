<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SubForge</title>
<style>
  :root {
    --ink: #17120d;
    --panel: #221a13;
    --edge: #3a2d22;
    --text: #f0e5d6;
    --muted: #9c8b78;
    --accent: #d8a13f;
    --accent-soft: rgba(216, 161, 63, 0.14);
    --ok: #7fc08a;
    --bad: #e08a7a;
  }

  * { box-sizing: border-box; }

  body {
    width: 320px;
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font: 400 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  [hidden] { display: none !important; }

  section { padding: 12px 14px; border-bottom: 1px solid var(--edge); }

  /* ---- Đầu popup: tên + công tắc tổng ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-bottom: 1px solid var(--edge);
  }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: 0.2px; color: var(--muted); }

  /* ---- Công tắc ---- */
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .switch input { position: absolute; opacity: 0; }
  .track {
    flex: none;
    width: 32px; height: 18px;
    border-radius: 9px;
    background: #3d2f23;
    position: relative;
    transition: background 140ms ease;
  }
  .track::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #8b7a68;
    transition: transform 140ms ease, background 140ms ease;
  }
  .switch input:checked + .track { background: var(--accent-soft); }
  .switch input:checked + .track::after { transform: translateX(14px); background: var(--accent); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Khoá khi chưa có video — phải TRÔNG như bị khoá, không thì người dùng bấm mãi không hiểu vì sao */
  .switch:has(input:disabled) { opacity: .5; cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    .track, .track::after { transition: none; }
  }

  /* ---- Khối OCR: tính năng chính ---- */
  .ocr { background: rgba(216, 161, 63, 0.05); }
  .ocr .switch.main { font-size: 13.5px; font-weight: 500; color: var(--text); }
  .ocr .switch.sub { margin: 9px 0 0 40px; }
  .ocr-status { margin: 9px 0 0 40px; font-size: 11.5px; line-height: 1.55; color: var(--muted); }
  .ocr-status strong { color: var(--text); font-weight: 500; }
  .ok   { color: var(--ok); }
  .warn { color: var(--accent); }
  .bad  { color: var(--bad); }

  .btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 6px 10px;
    border: 1px solid var(--edge);
    border-radius: 5px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .btn:hover { border-color: #55432f; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- Hàng điều khiển ---- */
  .row { display: flex; align-items: center; gap: 9px; }
  .row + .row { margin-top: 9px; }
  .row-label { width: 52px; flex: none; color: var(--muted); }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 18px; }
  .value { width: 32px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- Phụ đề từ file: thu gọn mặc định ---- */
  details.files { border-bottom: 1px solid var(--edge); }
  details.files summary {
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  details.files summary:hover { color: var(--text); }
  details.files summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .files-body { padding: 0 14px 12px; }
  .files-note { margin: 0 0 9px; font-size: 11.5px; color: var(--muted); }
  .files-body .row-label { width: 62px; white-space: nowrap; }

  .file-btn {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border: 1px solid var(--edge);
    border-radius: 5px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
  }
  .file-btn:hover { border-color: #55432f; }
  .file-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .file-btn.loaded { border-color: rgba(216, 161, 63, .45); }
  .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-count { flex: none; margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .nudge { display: flex; align-items: center; flex: none; }
  .nudge button {
    width: 22px; height: 26px;
    border: 1px solid var(--edge);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    border-radius: 4px;
  }
  .nudge button:hover { border-color: #55432f; }
  .nudge button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nudge output { width: 40px; text-align: center; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- Dòng trạng thái cuối ---- */
  .status { margin: 0; padding: 10px 14px 12px; font-size: 11.5px; color: var(--muted); }
  .status strong { color: var(--text); font-weight: 500; }
  kbd {
    padding: 0 4px;
    border: 1px solid var(--edge);
    border-radius: 3px;
    background: var(--panel);
    font: inherit;
    font-size: 10.5px;
  }
</style>
</head>
<body>

  <header>
    <span class="brand">SubForge</span>
    <label class="switch">
      <input type="checkbox" id="enabled" checked />
      <span class="track"></span>
      <span>Show subtitles</span>
    </label>
  </header>

  <section class="ocr">
    <label class="switch main">
      <input type="checkbox" id="ocrToggle" />
      <span class="track"></span>
      <span>Read subtitles &amp; translate to English</span>
    </label>
    <label class="switch sub" id="ocrShowViRow" hidden>
      <input type="checkbox" id="ocrShowVi" />
      <span class="track"></span>
      <span>Also show the original line</span>
    </label>
    <p class="ocr-status" id="ocrStatus" hidden></p>
  </section>

  <section>
    <div class="row">
      <label class="row-label" for="fontSize">Size</label>
      <input type="range" id="fontSize" min="14" max="46" step="1" />
      <span class="value" id="fontSizeVal"></span>
    </div>
    <div class="row">
      <label class="row-label" for="bottom">Position</label>
      <input type="range" id="bottom" min="0" max="30" step="1" />
      <span class="value" id="bottomVal"></span>
    </div>
  </section>

  <details class="files">
    <summary>Load subtitles from an .srt file</summary>
    <div class="files-body">
      <p class="files-note">Loading a file turns off subtitle reading.</p>
      <div class="row">
        <span class="row-label">Top</span>
        <button class="file-btn" id="pick1" type="button">
          <span class="file-name" id="name1">Choose file</span>
          <span class="file-count" id="count1"></span>
        </button>
        <div class="nudge" aria-label="Top line timing">
          <button type="button" data-nudge="1" data-delta="-0.5" aria-label="0.5 seconds earlier">−</button>
          <output id="off1">0.0s</output>
          <button type="button" data-nudge="1" data-delta="0.5" aria-label="0.5 seconds later">+</button>
        </div>
      </div>
      <div class="row">
        <span class="row-label">Bottom</span>
        <button class="file-btn" id="pick2" type="button">
          <span class="file-name" id="name2">Choose file</span>
          <span class="file-count" id="count2"></span>
        </button>
        <div class="nudge" aria-label="Bottom line timing">
          <button type="button" data-nudge="2" data-delta="-0.5" aria-label="0.5 seconds earlier">−</button>
          <output id="off2">0.0s</output>
          <button type="button" data-nudge="2" data-delta="0.5" aria-label="0.5 seconds later">+</button>
        </div>
      </div>
    </div>
  </details>

  <p class="status" id="status">Checking this page…</p>

  <input type="file" id="file1" accept=".srt,.vtt,.txt" hidden />
  <input type="file" id="file2" accept=".srt,.vtt,.txt" hidden />

  <script type="module" src="popup.js"></script>
</body>
</html>
